<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NarcoX - Authorized Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { 
    background: #cbd5e1; /* Match dashboard slate-300 */
    color: #1e293b; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    overflow: hidden; /* Prevent scrolling during splash */
  }

  /* Fade Animations */
  .fade-in { animation: fadeIn 0.5s forwards; }
  .fade-out { animation: fadeOut 0.5s forwards; }
  @keyframes fadeIn { from { opacity: 0; pointer-events: none; } to { opacity: 1; pointer-events: auto; } }
  @keyframes fadeOut { from { opacity: 1; pointer-events: auto; } to { opacity: 0; pointer-events: none; visibility: hidden; } }

  /* Screen Containers */
  .screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  /* Deep Blue Background for Splash and Language */
  .ncb-blue-bg {
    background-color: #1a365d;
    color: white;
  }

  /* Language Grid Buttons */
  .lang-btn {
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
    transition: all 0.2s;
    cursor: pointer;
    background: rgba(255,255,255,0.05);
  }
  .lang-btn:hover {
    background: rgba(255,255,255,0.15);
    border-color: #fbd38d; /* Gold hover */
  }
</style>
</head>
<body>

  <!-- STEP 1: SPLASH SCREEN -->
  <div id="screen-splash" class="screen ncb-blue-bg flex-col" style="z-index: 50;">
    <!-- Logo SVG -->
    <div style="background: white; border-radius: 50%; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1a365d" style="height: 100px; width: 100px;">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
    </div>
    <h1 style="margin-top: 30px; font-size: 1.5rem; letter-spacing: 4px; font-weight: bold; color: #cbd5e1;">NarcoX - NARCOTICS CONTROL BUREAU</h1>
    <div style="width: 50px; height: 2px; background: #1a365d; margin-top: 15px;"></div>
  </div>

  <!-- STEP 3: LOGIN SCREEN -->
  <div id="screen-login" class="screen" style="z-index: 30; opacity: 0; pointer-events: none;">
    <div class="w-full max-w-md bg-white border border-gray-300 rounded-xl p-8 shadow-xl">
      
      <div class="flex justify-center mb-6">
         <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1a365d" style="height: 60px; width: 60px;">
             <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
         </svg>
      </div>

      <h1 class="text-2xl font-bold text-[#1a365d] text-center mb-1">NarcoX Login</h1>
      <p class="text-sm text-gray-500 text-center mb-8 font-medium">Authorized Government Personnel Only</p>

      <label class="block text-xs font-bold text-gray-600 uppercase tracking-wide mb-2">Official Email Address</label>
      <input id="email" type="email" placeholder="officer@ncb.gov.in"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:border-[#1a365d] focus:ring-1 focus:ring-[#1a365d] transition-all mb-6" />

      <button id="loginBtn"
        class="w-full bg-[#1a365d] hover:bg-[#112240] text-white text-sm font-bold py-3 rounded-lg shadow-md transition-all uppercase tracking-wide">
        Verify Credentials
      </button>

      <div class="mt-6 border-t border-gray-200 pt-4 text-center">
        <p id="errorMsg" class="text-sm text-red-600 font-medium hidden"></p>
        <p class="text-[10px] text-gray-400 mt-2 uppercase tracking-wide">Secured by Government of India Intranet</p>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const splash = document.getElementById('screen-splash');
    const lang = document.getElementById('screen-lang');
    const login = document.getElementById('screen-login');

    // Step 1: Hide splash and show LOGIN directly after 2.5 seconds
    setTimeout(() => {
        splash.classList.add('fade-out');
        login.classList.add('fade-in');
        document.body.style.overflow = 'auto'; // restore scrolling
    }, 2500);

    // Step 3: Login Logic (Original backend logic preserved)
    const btn = document.getElementById('loginBtn');
    const emailInput = document.getElementById('email');
    const errorMsg = document.getElementById('errorMsg');

    async function attemptLogin() {
      errorMsg.classList.add('hidden');
      const emailVal = emailInput.value.trim();
      if (!emailVal) return;

      btn.disabled = true;
      btn.textContent = 'VERIFYING...';

      try {
        const res = await fetch('/api/auth?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailVal })
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          window.location.href = '/index.html';
        } else {
          errorMsg.textContent = data.error || 'Access denied. Unauthorized email.';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error securely connecting to server.';
        errorMsg.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'VERIFY CREDENTIALS';
      }
    }

    btn.addEventListener('click', attemptLogin);
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') attemptLogin(); });
  </script>
</body>
</html>
